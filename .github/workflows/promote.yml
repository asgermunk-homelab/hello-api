# Promote a tested dev image to prod. Runs by hand, and waits for approval
# in the GitHub Environment "prod". It copies the tag; it never rebuilds.
name: promote

on:
  workflow_dispatch:
    inputs:
      dev-tag:
        description: "The dev tag to promote, for example 3-8e39b47b-1791494780-dev"
        required: true
        type: string

concurrency:
  group: promote
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  promote:
    runs-on: ubuntu-latest
    environment: prod # the approval gate
    permissions:
      packages: write # needed to add a tag in GHCR
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      # Passed through env, never pasted into the script, so input cannot inject shell code.
      DEV_TAG: ${{ inputs.dev-tag }}
    steps:
      - name: Check the tag format
        run: |
          if ! [[ "$DEV_TAG" =~ ^[0-9]+-[a-f0-9]+-[0-9]+-dev$ ]]; then
            echo "Give a dev tag like 3-8e39b47b-1791494780-dev."
            exit 1
          fi
          echo "PROD_TAG=${DEV_TAG%-dev}-prod" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check that the dev image exists
        run: docker buildx imagetools inspect "$IMAGE:$DEV_TAG" > /dev/null

      # The prod tag keeps the unix time of the dev tag,
      # so Flux sorts the prod tags in build order.
      - name: Retag without a rebuild
        run: |
          docker buildx imagetools create --tag "$IMAGE:$PROD_TAG" "$IMAGE:$DEV_TAG"
          echo "Promoted $DEV_TAG -> $PROD_TAG" >> "$GITHUB_STEP_SUMMARY"
